version: '3.9'

services:
  migrate:
    image: ${IMAGE_NAME:-github-subscriptions-service:latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/github-subscriptions}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  app:
    image: ${IMAGE_NAME:-github-subscriptions-service:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/github-subscriptions}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      API_KEY: ${API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      PORT: 3000
      NODE_ENV: production
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-300000}
      SERVICE_NAME: ${SERVICE_NAME:-github-subscriptions-service}
      RABBITMQ_URL: ${DOCKER_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      OUTBOX_POLL_MS: 2000
      OUTBOX_MAX_ATTEMPTS: 10
      OUTBOX_BATCH_SIZE: 20
      SAGA_TIMEOUT_MS: 60000
      SAGA_SWEEP_MS: 30000
      GITHUB_TRANSPORT: ${GITHUB_TRANSPORT:-grpc}
      GITHUB_SERVICE_HTTP_URL: http://github:3200
      GITHUB_GRPC_ADDR: github:50062
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      github:
        condition: service_started
    restart: unless-stopped
    labels:
      logfilter: 'app'
    networks:
      - default
      - observability
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  notification:
    image: ${NOTIF_IMAGE_NAME:-notification-service:latest}
    build:
      context: .
      dockerfile: Dockerfile.notification
    ports:
      - '${NOTIFICATION_HTTP_HOST_PORT:-3100}:3100'
    environment:
      RABBITMQ_URL: ${DOCKER_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      NOTIF_RETRY_DELAY_MS: ${NOTIF_RETRY_DELAY_MS:-5000}
      NOTIF_MAX_ATTEMPTS: ${NOTIF_MAX_ATTEMPTS:-3}
      API_KEY: ${API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_MOCK_URL: ${EMAIL_MOCK_URL:-http://localhost:4000}
      EMAIL_FROM: ${EMAIL_FROM:-GitHub Release Notifier <noreply@tweeedlex.xyz>}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      NOTIFICATION_HTTP_PORT: 3100
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  github:
    image: ${GITHUB_IMAGE_NAME:-github-service:latest}
    build:
      context: .
      dockerfile: Dockerfile.github
    ports:
      - '${GITHUB_HTTP_HOST_PORT:-3200}:3200'
      - '${GITHUB_GRPC_HOST_PORT:-50062}:50062'
    environment:
      REDIS_URL: redis://redis:6379
      API_KEY: ${API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GH_CACHE_TTL_SECONDS: ${GH_CACHE_TTL_SECONDS:-600}
      GITHUB_HTTP_PORT: 3200
      GITHUB_GRPC_PORT: 50062
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_UI_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: github-subscriptions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d github-subscriptions']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  observability:
    external: true
