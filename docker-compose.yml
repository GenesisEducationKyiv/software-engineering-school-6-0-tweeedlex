version: '3.9'

services:
  migrate:
    image: ${IMAGE_NAME:-github-subscriptions-service:latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/github-subscriptions}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  app:
    image: ${IMAGE_NAME:-github-subscriptions-service:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/github-subscriptions}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      API_KEY: ${API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      PORT: 3000
      NODE_ENV: production
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-300000}
      SERVICE_NAME: ${SERVICE_NAME:-github-subscriptions-service}
      NOTIFICATION_HTTP_URL: ${NOTIFICATION_HTTP_URL:-http://notification:3100}
      NOTIFICATION_GRPC_ADDR: ${NOTIFICATION_GRPC_ADDR:-notification:50061}
      NOTIFICATION_TRANSPORT: ${NOTIFICATION_TRANSPORT:-http}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      notification:
        condition: service_started
    restart: unless-stopped
    labels:
      logfilter: 'app'
    networks:
      - default
      - observability
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  notification:
    image: ${NOTIF_IMAGE_NAME:-notification-service:latest}
    build:
      context: .
      dockerfile: Dockerfile.notification
    ports:
      # Left = host port (Windows reserves 50060-50159 for Hyper-V, so the gRPC
      # host port defaults to 50161 — outside that range). Right = container port,
      # which stays 50061 to match NOTIFICATION_GRPC_ADDR=notification:50061.
      - '${NOTIFICATION_HTTP_HOST_PORT:-3100}:3100'
      - '${NOTIFICATION_GRPC_HOST_PORT:-50161}:50061'
    environment:
      REDIS_URL: ${NOTIF_REDIS_URL:-redis://notif-redis:6379}
      API_KEY: ${API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_MOCK_URL: ${EMAIL_MOCK_URL:-http://localhost:4000}
      EMAIL_FROM: ${EMAIL_FROM:-GitHub Release Notifier <noreply@tweeedlex.xyz>}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      NOTIFICATION_HTTP_PORT: 3100
      NOTIFICATION_GRPC_PORT: 50061
      NODE_ENV: production
    depends_on:
      notif-redis:
        condition: service_healthy
    restart: unless-stopped

  notif-redis:
    image: redis:7-alpine
    volumes:
      - notif_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: github-subscriptions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d github-subscriptions']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  notif_redis_data:

networks:
  observability:
    external: true
