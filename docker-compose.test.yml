services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: github-subscriptions-test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d github-subscriptions-test']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  notif-redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  mock-services:
    image: github-subscriptions-service-test-runner
    build:
      context: .
      dockerfile: Dockerfile.test
    command: npm run mocks:container
    environment:
      MOCK_PORT: 4000
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:4000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  notification:
    image: notification-service-test
    build:
      context: .
      dockerfile: Dockerfile.notification
    environment:
      REDIS_URL: redis://notif-redis:6379
      API_KEY: test-api-key
      EMAIL_PROVIDER: mock
      EMAIL_MOCK_URL: http://mock-services:4000
      BASE_URL: http://app-service:3000
      NOTIFICATION_HTTP_PORT: 3100
      NOTIFICATION_GRPC_PORT: 50061
      NODE_ENV: test
    depends_on:
      notif-redis:
        condition: service_healthy
      mock-services:
        condition: service_healthy
    networks:
      default:
        aliases:
          - notification-service
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''net'').createConnection(3100).on(''connect'',()=>process.exit(0)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    image: github-subscriptions-service-test-app
    build:
      context: .
      dockerfile: Dockerfile
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/github-subscriptions-test
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: github-subscriptions-service-test-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/github-subscriptions-test
      REDIS_URL: redis://redis:6379
      API_KEY: test-api-key
      RESEND_API_KEY: test-resend-key
      EMAIL_PROVIDER: mock
      EMAIL_MOCK_URL: http://mock-services:4000
      GITHUB_API_BASE_URL: http://mock-services:4000/github
      BASE_URL: http://app-service:3000
      NOTIFICATION_TRANSPORT: http
      NOTIFICATION_HTTP_URL: http://notification-service:3100
      NOTIFICATION_GRPC_ADDR: notification-service:50061
      PORT: 3000
      GRPC_PORT: 50051
      NODE_ENV: test
      SCAN_INTERVAL_MS: 3600000
      GH_CACHE_TTL_SECONDS: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-services:
        condition: service_healthy
      notification:
        condition: service_healthy
    networks:
      default:
        aliases:
          - app-service
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/api/metrics'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  unit-test-runner:
    image: github-subscriptions-service-test-runner
    build:
      context: .
      dockerfile: Dockerfile.test
    command: npm run test:unit:container
    environment:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      API_KEY: test-api-key
      RESEND_API_KEY: test-resend-key
      NODE_ENV: test

  api-test-runner:
    image: github-subscriptions-service-test-runner
    build:
      context: .
      dockerfile: Dockerfile.test
    command: sh -c "npm run test:$${TEST_SUITE}:container"
    environment:
      TEST_SUITE: ${TEST_SUITE:-integration}
      APP_BASE_URL: http://app-service:3000
      MOCK_SERVICE_URL: http://mock-services:4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/github-subscriptions-test
      REDIS_URL: redis://redis:6379
      API_KEY: test-api-key
      RESEND_API_KEY: test-resend-key
      NODE_ENV: test
    depends_on:
      app:
        condition: service_healthy
