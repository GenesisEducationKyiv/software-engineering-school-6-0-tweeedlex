syntax = "proto3";

package github;

service GitHubService {
  rpc VerifyRepo (VerifyRepoRequest) returns (VerifyRepoResponse);
  rpc GetLatestRelease (GetLatestReleaseRequest) returns (GetLatestReleaseResponse);
}

message VerifyRepoRequest {
  string owner = 1;
  string name = 2;
}

// Mirrors GitHubRepo in github.types.ts. owner is flattened to owner_login.
message VerifyRepoResponse {
  int64 id = 1;
  string full_name = 2;
  string name = 3;
  string owner_login = 4;
  string description = 5;
  string html_url = 6;
  bool private = 7;
}

message GetLatestReleaseRequest {
  string owner = 1;
  string name = 2;
  bool bypass_cache = 3;
}

// Mirrors GitHubRelease in github.types.ts.
message Release {
  int64 id = 1;
  string tag_name = 2;
  string name = 3;
  string body = 4;
  string html_url = 5;
  string published_at = 6;
  bool draft = 7;
  bool prerelease = 8;
}

message GetLatestReleaseResponse {
  bool found = 1;
  Release release = 2;
}
